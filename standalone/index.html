<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TizenTwitch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0e0e10;
            overflow: hidden;
        }
        
        #twitch-player {
            width: 100vw;
            height: 100vh;
            border: none;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9146ff;
            font-size: 24px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Twitch...</div>
    <iframe id="twitch-player" src="https://www.twitch.tv" style="display: none;"></iframe>
    
    <script>
        const iframe = document.getElementById('twitch-player');
        const loading = document.getElementById('loading');
        
        iframe.onload = function() {
            loading.style.display = 'none';
            iframe.style.display = 'block';
        };
        
        // Fallback timeout
        setTimeout(() => {
            loading.style.display = 'none';
            iframe.style.display = 'block';
        }, 5000);
    </script>
</body>
</html>
